name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt ruff==0.11.13
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python -m compileall -q api cache config llm services main.py
      - run: python -m unittest discover -v
